spring.application.name=smart-gateway-service
# Vercel tells the container which port to use via $PORT.
server.port=${PORT:8080}

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.api.username=${GATEKEEPER_GATEWAY_USERNAME:gateway-service}
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Access events for the Analytics Service
gateway.kafka.access-topic=${GATEKEEPER_ACCESS_TOPIC:gateway-access-events}
# Don't let a down Kafka slow the gateway down.
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.admin.fail-fast=false
# Without a Kafka broker, give up on creating topics after 5s instead of 30s.
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.close-timeout=5s

# Redis: a full URL (e.g. Upstash "rediss://default:password@host:6379") or local default.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Set KAFKA_ENABLED=false where no Kafka broker exists (e.g. Vercel).
gateway.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}
spring.kafka.admin.auto-create=${KAFKA_ENABLED:true}

# If set, access events go straight to the Analytics Service over HTTP instead of Kafka.
gateway.analytics.url=${ANALYTICS_URL:}
gateway.analytics.ingest-token=${INGEST_TOKEN:local-ingest-token}
