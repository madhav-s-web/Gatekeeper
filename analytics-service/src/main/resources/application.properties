spring.application.name=analytics-service

# Vercel tells the container which port to use via $PORT.
server.port=${PORT:8082}

info.app.name=Analytics Service
info.app.description=Access-event storage and API usage analytics

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gatekeeper_analytics}
# Creates the index that deletes access logs after 30 days.
spring.data.mongodb.auto-index-creation=true

gateway.kafka.access-topic=${GATEKEEPER_ACCESS_TOPIC:gateway-access-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Same secret as API Management, which issues the tokens.
security.jwt.secret=${JWT_SECRET:gatekeeper-demo-jwt-secret-key-change-before-production}
# The dashboard (served by API Management) calls this service from the browser.
analytics.allowed-origin=${DASHBOARD_ORIGIN:http://localhost:8081}

# Set KAFKA_ENABLED=false where no Kafka broker exists (e.g. Vercel); the gateway then POSTs events instead.
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}
# Shared secret the gateway must send with POST /api/internal/access-events.
analytics.ingest-token=${INGEST_TOKEN:local-ingest-token}
