spring.application.name=api-management-service
# Vercel tells the container which port to use via $PORT.
server.port=${PORT:8081}

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# Secrets come from environment variables; the defaults are for local development only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gatekeeper?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
# Small pool: serverless instances share a limited number of connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET:gatekeeper-demo-jwt-secret-key-change-before-production}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
# Don't let a down Kafka block API calls for the default 60 seconds.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.admin.fail-fast=false
# Set KAFKA_ENABLED=false where no Kafka broker exists (e.g. Vercel).
gateway.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.admin.auto-create=${KAFKA_ENABLED:true}

# Public URL of the Analytics Service, used by the dashboard's Traffic page.
# Empty = same host on port 8082 (local development).
gatekeeper.analytics-url=${ANALYTICS_URL:}
# Without a Kafka broker, give up on creating topics after 5s instead of 30s.
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.close-timeout=5s
